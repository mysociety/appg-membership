title: APPG Register
description: APPG Register as a spreadsheet
custom:
  row_count: 452
path: register.parquet
name: register
profile: data-resource
scheme: file
format: parquet
hashing: md5
encoding: utf-8
schema:
  fields:
  - name: slug
    type: string
    extDtype: str
    description: Slugified name of the APPG
    constraints:
      unique: true
    example: access-to-justice
  - name: title
    type: string
    extDtype: str
    description: Title of the APPG
    constraints:
      unique: false
    example: ''
  - name: purpose
    type: string
    extDtype: str
    description: Purpose of the APPG
    constraints:
      unique: false
    example: ''
  - name: category
    type: string
    extDtype: str
    description: Category of the APPG
    constraints:
      unique: false
      enum:
      - ''
      - Country, Area or Region Group
      - Subject Group
    example: ''
  - name: registrable_benefits
    type: string
    extDtype: str
    description: Registrable benefits of the APPG
    constraints:
      unique: false
      enum:
      - ''
      - Financial Benefits
    example: ''
  - name: source_url
    type: string
    extDtype: str
    description: URL of the APPG on the Parliament website
    constraints:
      unique: true
    example:
      https://publications.parliament.uk/pa/cm/cmallparty/250328/access-to-justice.htm
  - name: registered_contact_name
    type: string
    extDtype: str
    description: Name of the registered contact
    constraints:
      unique: false
    example: ''
  - name: registered_contact_address
    type: string
    extDtype: str
    description: Address of the registered contact
    constraints:
      unique: false
    example: ''
  - name: registered_contact_email
    type: string
    extDtype: str
    description: Email of the registered contact
    constraints:
      unique: false
      enum:
      - ''
    example: ''
  - name: public_enquiry_point_name
    type: string
    extDtype: str
    description: Name of the public enquiry point
    constraints:
      unique: false
    example: ''
  - name: public_enquiry_point_email
    type: string
    extDtype: str
    description: Email of the public enquiry point
    constraints:
      unique: false
      enum:
      - ''
    example: ''
  - name: secretariat
    type: string
    extDtype: str
    description: Name of the secretariat
    constraints:
      unique: false
    example: ''
  - name: website
    type: string
    extDtype: str
    description: URL of the APPG website
    constraints:
      unique: false
    example: None
  - name: website_status
    type: string
    extDtype: str
    description: Status of the APPG website
    constraints:
      unique: false
      enum:
      - bad_search
      - manual
      - no_search
      - register
      - search
    example: bad_search
  - name: date_of_most_recent_agm
    type: date
    description: Date of the most recent AGM
    constraints:
      unique: false
    example: '2024-07-22'
  - name: published_income_expenditure_statement
    type: boolean
    description: Published income and expenditure statement
    constraints:
      unique: false
    example: 'False'
  - name: reporting_year
    type: string
    extDtype: str
    description: Reporting year of the APPG
    constraints:
      unique: false
    example: 01 Apr to 31 Mar
  - name: next_reporting_deadline
    type: date
    description: Next reporting deadline for the APPG
    constraints:
      unique: false
    example: '2025-08-01'
