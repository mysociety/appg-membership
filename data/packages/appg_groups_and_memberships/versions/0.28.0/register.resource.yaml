title: APPG Register
description: APPG Register as a spreadsheet
custom:
  row_count: 916
path: register.parquet
name: register
profile: data-resource
scheme: file
format: parquet
hashing: md5
encoding: utf-8
schema:
  fields:
  - name: slug
    type: string
    extDtype: str
    description: Slugified name of the APPG
    constraints:
      unique: false
    example: abraham-accords
  - name: title
    type: string
    extDtype: str
    description: Title of the APPG
    constraints:
      unique: false
    example: Addysg Bellach a Sgiliau - Grŵp Trawsbleidiol
  - name: purpose
    type: string
    extDtype: str
    description: Purpose of the APPG
    constraints:
      unique: false
    example: ''
  - name: category
    type: string
    extDtype: str
    description: Category of the APPG
    constraints:
      unique: false
      enum:
      - ''
      - Country, Area or Region Group
      - Subject Group
    example: ''
  - name: parliament
    type: string
    extDtype: str
    description: Parliament the APPG is in
    constraints:
      unique: false
      enum:
      - ni-assembly
      - scottish-parliament
      - senedd-cy
      - senedd-en
      - uk
    example: ni-assembly
  - name: registrable_benefits
    type: string
    extDtype: str
    description: Registrable benefits of the APPG
    constraints:
      unique: false
    example: ''
  - name: source_url
    type: string
    extDtype: str
    description: URL of the APPG on the Parliament website
    constraints:
      unique: false
    example: https://aims.niassembly.gov.uk/mlas/apgdetails.aspx?&cid=1218
  - name: categories
    type: string
    extDtype: str
    description: Pipe seperated list of (mysociety added) categories for the
      APPG
    constraints:
      unique: false
    example: ''
  - name: registered_contact_name
    type: string
    extDtype: str
    description: Name of the registered contact
    constraints:
      unique: false
    example: ''
  - name: registered_contact_address
    type: string
    extDtype: str
    description: Address of the registered contact
    constraints:
      unique: false
    example: ''
  - name: registered_contact_email
    type: string
    extDtype: str
    description: Email of the registered contact
    constraints:
      unique: false
    example: ''
  - name: public_enquiry_point_name
    type: string
    extDtype: str
    description: Name of the public enquiry point
    constraints:
      unique: false
    example: ''
  - name: public_enquiry_point_email
    type: string
    extDtype: str
    description: Email of the public enquiry point
    constraints:
      unique: false
    example: ''
  - name: secretariat
    type: string
    extDtype: str
    description: Name of the secretariat
    constraints:
      unique: false
    example: ''
  - name: website
    type: string
    extDtype: str
    description: URL of the APPG website
    constraints:
      unique: false
    example: None
  - name: website_status
    type: string
    extDtype: str
    description: Status of the APPG website
    constraints:
      unique: false
      enum:
      - bad_search
      - manual
      - no_search
      - register
      - search
    example: bad_search
  - name: detailed_benefits
    type: string
    extDtype: str
    description: Json dict of the benefits of the APPG
    constraints:
      unique: false
    example: '[{"Source": "ABInBev", "Value \u00a3s": "4,950", "Received": "01/10/2025",
      "Registered": "17/10/2025", "benefit_type": "Financial Benefits"}, {"Source":
      "Stonegate", "Value \u00a3s": "4,950", "Received": "02/10/2025", "Registered":
      "17/10/2025", "benefit_type": "Financial Benefits"}, {"Source": "Diageo", "Value
      \u00a3s": "4,950", "Received": "02/10/2025", "Registered": "17/10/2025", "benefit_type":
      "Financial Benefits"}, {"Source": "SIBA", "Value \u00a3s": "2,835", "Received":
      "07/11/2025", "Registered": "14/11/2025", "benefit_type": "Financial Benefits"},
      {"Source": "Molson Coors", "Value \u00a3s": "4,950", "Received": "07/11/2025",
      "Registered": "14/11/2025", "benefit_type": "Financial Benefits"}, {"Source":
      "Greene King", "Value \u00a3s": "4,950", "Received": "07/11/2025", "Registered":
      "14/11/2025", "benefit_type": "Financial Benefits"}, {"Source": "Carlsberg Britvic",
      "Value \u00a3s": "4,950", "Received": "07/11/2025", "Registered": "14/11/2025",
      "benefit_type": "Financial Benefits"}, {"Source": "Asahi", "Value \u00a3s":
      "2,200", "Received": "10/11/2025", "Registered": "14/11/2025", "benefit_type":
      "Financial Benefits"}, {"Source": "Heineken", "Value \u00a3s": "4,950", "Received":
      "02/12/2025", "Registered": "15/12/2025", "benefit_type": "Financial Benefits"},
      {"Source": "Marstons", "Value \u00a3s": "2,707", "Received": "02/04/2026", "Registered":
      "21/04/2026", "benefit_type": "Financial Benefits"}, {"Source": "UK Hospitality",
      "Value \u00a3s": "1,504", "Received": "02/04/2026", "Registered": "21/04/2026",
      "benefit_type": "Financial Benefits"}, {"Source": "Greene King", "Value \u00a3s":
      "5,870", "Received": "30/09/2026", "Registered": "02/10/2026", "benefit_type":
      "Financial Benefits"}, {"Source": "Admiral Taverns", "Value \u00a3s": "1,910",
      "Received": "30/09/2026", "Registered": "02/10/2026", "benefit_type": "Financial
      Benefits"}]'
  - name: date_of_most_recent_agm
    type: date
    description: Date of the most recent AGM
    constraints:
      unique: false
    example: '2024-07-23'
  - name: published_income_expenditure_statement
    type: boolean
    description: Published income and expenditure statement
    constraints:
      unique: false
    example: 'False'
  - name: reporting_year
    type: string
    extDtype: str
    description: Reporting year of the APPG
    constraints:
      unique: false
    example: 01 Apr to 31 Mar
  - name: next_reporting_deadline
    type: date
    description: Next reporting deadline for the APPG
    constraints:
      unique: false
    example: '2025-11-23'
  - name: registration_id
    type: string
    extDtype: str
    description: Senedd registration identity, including term and official body
      ID; null for other parliaments
    constraints:
      unique: false
    example: senedd-7-1030
  - name: senedd_term
    type: integer
    extDtype: Int64
    description: Senedd term number; a registration never carries membership
      into another term
    constraints:
      unique: false
    example: '7'
  - name: valid_from
    type: date
    description: Known membership or registration start, inclusive; null when
      unknown
    constraints:
      unique: false
    example: ''
  - name: valid_until
    type: date
    description: Latest possible end, exclusive; not evidence of continuous
      membership before this date
    constraints:
      unique: false
    example: ''
  - name: end_reason
    type: string
    description: 'Reason for the validity bound: term_ended, left_senedd, no_longer_listed
      or registration_closed'
    constraints:
      unique: false
    example: ''
  - name: observed_on
    type: date
    description: First dated observation of this membership spell or
      registration; not its start date
    constraints:
      unique: false
    example: '2026-11-11'
hash: 3e065a0384be0814e620274c8f1b9d41
